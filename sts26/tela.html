<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela · Siará Tech Summit 26</title>
<style>
  /* Telas cheias 1920×1080 (Web Browser input do vMix).
     ?t=comecaremos | intervalo | dividida
     &dia=1|2|3  fixa o dia   ·   &sala=CODIGO  segue o dia escolhido no controle
     As janelas de câmera (intervalo/dividida) são transparentes: ponha a câmera numa camada ABAIXO desta tela. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.fundo { background: repeating-conic-gradient(#3a3f4a 0 25%, #2c3039 0 50%) 0 0 / 40px 40px; }
  #palco { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #palco img { position: absolute; inset: 0; width: 1920px; height: 1080px; transition: opacity .8s ease; }
  /* ponto vermelho do "Começaremos em breve" pulsando por cima do da arte */
  .pulso { position: absolute; left: 1394px; top: 835px; width: 29px; height: 29px; border-radius: 50%; }
  .pulso::before, .pulso::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #ff0a3c; }
  .pulso::after { animation: pulso 1.6s ease-out infinite; }
  @keyframes pulso { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
</style>
</head>
<body>
<div id="palco"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../comum/gc.js?v=20261006a"></script>
<script>
const q = new URLSearchParams(location.search);
const T = ['comecaremos', 'intervalo', 'dividida'].includes(q.get('t')) ? q.get('t') : 'comecaremos';
if (q.get('fundo') === '1') document.body.classList.add('fundo');
const palco = document.getElementById('palco');
function ajusta() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  palco.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', ajusta); ajusta();

// pré-carrega os 3 dias pra troca não piscar
const imgs = [1, 2, 3].map(d => { const i = new Image(); i.src = `img/tela-${T}-dia${d}.png`; i.alt = ''; i.style.opacity = 0; palco.appendChild(i); return i; });
if (T === 'comecaremos') palco.insertAdjacentHTML('beforeend', '<div class="pulso"></div>');
let atual = 0;
function dia(d) {
  d = Math.min(3, Math.max(1, parseInt(d) || 1));
  if (d === atual) return;
  atual = d;
  imgs.forEach((im, i) => im.style.opacity = i + 1 === d ? 1 : 0);
}
dia(q.get('dia') || 1);
if (!q.get('dia') && GC.ativo()) { GC.on('estado', e => dia(e.dia)); GC.iniciar(); }
</script>
</body>
</html>
